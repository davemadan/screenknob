[package]
name = "screenknob"
description = "Volume control, keys and the macOS volume popup for HDMI and DisplayPort screens"
license = "MIT"
version = "0.2.2"
edition = "2024"

[dependencies]
block2 = "0.6"
core-foundation = "0.10.1"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3"
tray-icon = "0.27.0"
winit = { version = "0.30", default-features = false }

[profile.release]
opt-level = 3

[[example]]
name = "make_icon"
path = "icon/make_icon.rs"
